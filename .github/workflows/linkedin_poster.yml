name: LinkedIn Poster

on:
  schedule:
    # Tue/Wed/Thu at 10:00 UTC — three posts a week, not seven.
    #
    # Daily posting with ~1 reaction per post trained LinkedIn's algorithm to
    # treat the audience as uninterested, and reach compounded downward. Fewer,
    # stronger posts on the highest-engagement weekdays (Tue-Thu; Mon and Fri
    # are measurably weaker) give each one a real chance to earn distribution.
    - cron: "0 10 * * 2,3,4"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LinkedIn poster
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json urls.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update published state [skip ci]"
            git push
          fi
